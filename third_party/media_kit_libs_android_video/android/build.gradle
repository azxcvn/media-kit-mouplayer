import java.io.File

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    // 自建内核 jar 随包分发（android/jars/），直接作为依赖——
    // 不再像官方包那样构建期从 GitHub release 下载（也就不需要下载任务与
    // 输出目录复制，规避 Gradle 9 的隐式任务依赖校验问题）。
    // 内核来源：https://github.com/azxcvn/libmpv-android-video-build (mk-thumbnail 分支)
    // 内含 mk_thumbnail_grab / mk_thumbnail_free / mk_thumbnail_clear_cache 导出符号。
    dependencies {
        implementation fileTree(dir: 'jars', include: '*.jar')
    }
}
